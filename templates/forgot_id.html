
<!DOCTYPE html>
<html lang="tg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cyber TJ — Барқароркунии ID</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;

            font-family: Arial, sans-serif;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(circle at top left, #2563eb, transparent 35%),
                radial-gradient(circle at bottom right, #7c3aed, transparent 35%),
                #07111f;
        }

        .box {
            width: 100%;
            max-width: 430px;

            padding: 30px;

            border-radius: 28px;

            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.18);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #cbd5e1;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        input,
        textarea {
            width: 100%;

            padding: 15px;
            margin-bottom: 15px;

            border: none;
            outline: none;

            border-radius: 16px;

            background: rgba(255, 255, 255, 0.12);

            color: white;

            font-size: 16px;

            font-family: Arial, sans-serif;
        }

        input::placeholder,
        textarea::placeholder {
            color: #cbd5e1;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        button {
            width: 100%;

            padding: 15px;

            border: none;
            border-radius: 16px;

            background: #2563eb;

            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .error {
            padding: 13px;
            margin-bottom: 15px;

            border-radius: 15px;

            background: rgba(239, 68, 68, 0.18);
            border: 1px solid rgba(239, 68, 68, 0.4);

            text-align: center;
        }

        .success {
            padding: 15px;
            margin-bottom: 15px;

            border-radius: 15px;

            background: rgba(34, 197, 94, 0.18);
            border: 1px solid rgba(34, 197, 94, 0.4);

            text-align: center;
            line-height: 1.5;
        }

        .back {
            display: block;

            margin-top: 20px;

            text-align: center;

            color: #93c5fd;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .info {
            margin-top: 20px;

            padding: 14px;

            border-radius: 15px;

            background: rgba(255, 255, 255, 0.06);

            color: #cbd5e1;

            font-size: 14px;

            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🔑 ID-ро фаромӯш кардед?</h1>

    <div class="description">
        Маълумоти аккаунтатонро нависед.
        Дархост ба админи Cyber TJ фиристода мешавад.
    </div>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    {% if success %}

        <div class="success">
            {{ success }}
        </div>

    {% endif %}


    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="👤 Username"
        >

        <input
            type="email"
            name="email"
            placeholder="📧 Email"
        >

        <textarea
            name="message"
            placeholder="💬 Масалан: Ман ID-и аккаунтамро фаромӯш кардам."
        ></textarea>

        <button type="submit">
            📩 Фиристодан ба админ
        </button>

    </form>


    <div class="info">
        🔒 Маълумот танҳо барои баррасии дархости
        барқароркунии аккаунт истифода мешавад.
    </div>


    <a href="/register" class="back">
        ← Бозгашт ба регистрация
    </a>

</div>

</body>
</html>
```
