
<!DOCTYPE html>
<html lang="tg">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cyber TJ — Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at top left,
                    #00c6ff 0%,
                    transparent 35%
                ),

                radial-gradient(
                    circle at top right,
                    #7b2cff 0%,
                    transparent 35%
                ),

                radial-gradient(
                    circle at bottom,
                    #00ff88 0%,
                    transparent 35%
                ),

                #05070d;

        }


        .container {

            width: 100%;
            max-width: 430px;

        }


        .card {

            padding: 32px 24px;

            border-radius: 30px;

            background:
                rgba(255,255,255,0.10);

            border:
                1px solid
                rgba(255,255,255,0.18);

            backdrop-filter:
                blur(25px);

            -webkit-backdrop-filter:
                blur(25px);

            box-shadow:
                0 25px 70px
                rgba(0,0,0,0.45);

        }


        .logo {

            width: 85px;
            height: 85px;

            margin:
                0 auto 20px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 25px;

            font-size: 42px;

            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #0072ff,
                    #7b2cff
                );

            box-shadow:
                0 15px 35px
                rgba(0,0,0,0.35);

        }


        h1 {

            text-align: center;

            font-size: 29px;

            margin-bottom: 8px;

        }


        .subtitle {

            text-align: center;

            color:
                rgba(255,255,255,0.65);

            font-size: 14px;

            margin-bottom: 28px;

        }


        .flash {

            padding: 14px;

            margin-bottom: 18px;

            border-radius: 15px;

            background:
                rgba(255,70,70,0.15);

            border:
                1px solid
                rgba(255,70,70,0.3);

            color: #ffffff;

            text-align: center;

            font-size: 14px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: bold;

        }


        input {

            width: 100%;

            padding: 16px 17px;

            margin-bottom: 17px;

            border: none;

            outline: none;

            border-radius: 17px;

            color: white;

            font-size: 16px;

            background:
                rgba(255,255,255,0.10);

            border:
                1px solid
                rgba(255,255,255,0.15);

        }


        input::placeholder {

            color:
                rgba(255,255,255,0.40);

        }


        input:focus {

            border-color:
                rgba(0,198,255,0.7);

            background:
                rgba(255,255,255,0.14);

        }


        .login-btn {

            width: 100%;

            padding: 17px;

            margin-top: 5px;

            border: none;

            border-radius: 18px;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #0072ff,
                    #7b2cff
                );

            box-shadow:
                0 12px 30px
                rgba(0,0,0,0.3);

            transition: 0.2s;

        }


        .login-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 17px 35px
                rgba(0,0,0,0.4);

        }


        .login-btn:active {

            transform:
                scale(0.97);

        }


        .links {

            margin-top: 22px;

            display: flex;

            flex-direction: column;

            gap: 12px;

            text-align: center;

        }


        .links a {

            color: white;

            text-decoration: none;

            font-size: 14px;

            padding: 12px;

            border-radius: 14px;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid
                rgba(255,255,255,0.10);

        }


        .links a:hover {

            background:
                rgba(255,255,255,0.13);

        }


        .telegram {

            background:
                rgba(0,136,204,0.18) !important;

            border-color:
                rgba(0,136,204,0.35) !important;

        }


        .footer {

            margin-top: 22px;

            text-align: center;

            color:
                rgba(255,255,255,0.40);

            font-size: 12px;

        }


        @media (max-width: 480px) {

            body {

                padding: 14px;

            }

            .card {

                padding: 27px 18px;

                border-radius: 25px;

            }

            h1 {

                font-size: 25px;

            }

        }

    </style>

</head>


<body>


<div class="container">

    <div class="card">


        <div class="logo">
            🛡️
        </div>


        <h1>
            Cyber TJ
        </h1>


        <div class="subtitle">
            Ба аккаунти худ ворид шавед
        </div>


        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="flash">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form
            method="POST"
            action="/login"
        >


            <label>
                👤 Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Username-и худро ворид кунед"
                autocomplete="username"
                required
            >


            <label>
                🔐 Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Password-и худро ворид кунед"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                class="login-btn"
            >

                🔐 ДОХИЛ ШУДАН

            </button>


        </form>


        <div class="links">

            <a href="/register">
                📝 Ҳоло аккаунт надорам — Регистрация
            </a>


            <a href="/forgot-id">
                🆔 ID-амро фаромӯш кардам
            </a>


            <a
                href="https://t.me/CyberTJ_2026_bot"
                target="_blank"
                class="telegram"
            >

                ✈️ КУШОДАНИ TELEGRAM БОТ

            </a>

        </div>


        <div class="footer">

            🛡️ Cyber TJ PRO

        </div>


    </div>

</div>


</body>

</html>
